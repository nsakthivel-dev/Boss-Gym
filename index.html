    <!-- Robust Service Worker Registration & Update Detection -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then((registration) => {
              console.log('[SW] Registered successfully with scope:', registration.scope);

              // If a worker is already waiting (installed in background), notify app immediately
              if (registration.waiting && navigator.serviceWorker.controller) {
                window.dispatchEvent(new CustomEvent('sw-update-available', {
                  detail: { registration, waitingWorker: registration.waiting }
                }));
              }

              // Listen for when a new service worker is installing
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                if (!newWorker) return;

                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // New version is installed and waiting for activation
                    window.dispatchEvent(new CustomEvent('sw-update-available', {
                      detail: { registration, waitingWorker: newWorker }
                    }));
                  }
                });
              });

              // Check for updates when page becomes visible again (user switches tabs / resumes PWA)
              document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                  registration.update().catch((err) => console.debug('[SW] Update check error:', err));
                }
              });

              // Also check periodically (every 30 minutes)
              setInterval(() => {
                registration.update().catch((err) => console.debug('[SW] Periodic check error:', err));
              }, 30 * 60 * 1000);
            })
            .catch((error) => {
              console.warn('[SW] Registration failed:', error);
            });

          // Prevent reload loops on controller change
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
