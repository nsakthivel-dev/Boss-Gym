<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#c9a227">
  <title>Offline · New Boss Gym</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      background-color: #faf9f6;
      color: #18181b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      max-width: 480px;
      width: 100%;
      background: #ffffff;
      border: 1px solid #e8e4d8;
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 10px 30px -5px rgba(201, 162, 39, 0.12), 0 4px 12px -2px rgba(0, 0, 0, 0.04);
    }

    .badge-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: #fdfaf0;
      border: 1px solid #e8dcbe;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: #c9a227;
      box-shadow: 0 4px 14px rgba(201, 162, 39, 0.15);
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: #18181b;
    }

    .subtitle {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #71717a;
      margin-bottom: 28px;
    }

    .tips-card {
      background: #faf9f6;
      border: 1px solid #ede8dc;
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 28px;
      text-align: left;
    }

    .tips-title {
      color: #8c6e11;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .tips-list {
      list-style: none;
    }

    .tips-list li {
      font-size: 0.875rem;
      color: #52525b;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tips-list li:last-child {
      margin-bottom: 0;
    }

    .bullet {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #c9a227;
      flex-shrink: 0;
    }

    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 24px;
      background: #c9a227;
      color: #ffffff;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(201, 162, 39, 0.25);
      transition: all 0.2s ease;
    }

    .btn-retry:hover {
      background: #b8911d;
      transform: translateY(-1px);
    }

    .status {
      margin-top: 20px;
      font-size: 0.825rem;
      font-weight: 500;
      color: #a1a1aa;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge-icon">📡</div>
    <h1>No Connection</h1>
    <p class="subtitle">You appear to be offline. Reconnect to access live member and gym data.</p>
    
    <div class="tips-card">
      <div class="tips-title">Troubleshooting</div>
      <ul class="tips-list">
        <li><span class="bullet"></span>Check cellular data or Wi-Fi</li>
        <li><span class="bullet"></span>Disable airplane mode</li>
        <li><span class="bullet"></span>Previous pages may still be viewable</li>
      </ul>
    </div>

    <button class="btn-retry" onclick="window.location.reload()">
      Retry Connection
    </button>

    <div class="status" id="status">
      Waiting for network signal...
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    
    function updateStatus() {
      if (navigator.onLine) {
        statusEl.textContent = '✓ Back online! Reloading application...';
        statusEl.style.color = '#16a34a';
        setTimeout(() => {
          window.location.reload();
        }, 1200);
      } else {
        statusEl.textContent = '● Device is currently offline';
        statusEl.style.color = '#dc2626';
      }
    }

    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
    updateStatus();

    setInterval(() => {
      if (!navigator.onLine) {
        fetch('/', { method: 'HEAD' })
          .then(() => window.location.reload())
          .catch(() => {});
      }
    }, 6000);
  </script>
</body>
</html>
